<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docs 文件列表</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #64748b;
      --line: #dbe3ea;
      --accent: #0f766e;
      --accent-soft: #e6f4f1;
      --code: #eef2f5;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    a {
      color: var(--accent);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }

    header,
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    header {
      padding: 28px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      max-width: 760px;
      color: var(--muted);
      font-size: 16px;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 5px 11px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #115e59;
      font-size: 14px;
      font-weight: 650;
    }

    section {
      margin-top: 18px;
      padding: 22px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 21px;
      letter-spacing: 0;
    }

    .file-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .file-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 150px;
      gap: 12px;
      align-items: center;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .file-name {
      overflow-wrap: anywhere;
      font-weight: 650;
    }

    .file-meta {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    .source {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", monospace;
      font-size: 13px;
    }

    code {
      padding: 2px 5px;
      border-radius: 5px;
      background: var(--code);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
        "Liberation Mono", monospace;
      font-size: 0.92em;
    }

    @media (max-width: 640px) {
      .page {
        padding: 18px 12px 36px;
      }

      header,
      section {
        padding: 18px;
      }

      .file-item {
        grid-template-columns: 1fr;
        gap: 4px;
      }

      .file-meta {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <h1>Blog</h1>
      <div class="meta">
        <span class="pill">4 篇文章</span>
      </div>
    </header>

    <section>
      <h2>Blog</h2>
      <ul class="file-list">
        <li class="file-item">
          <a class="file-name" href="blog/context-engineering-guide.html">Context Engineering 开发指南</a>
          <span class="file-meta">2026-05-18 14:33</span>
        </li>
        <li class="file-item">
          <a class="file-name" href="blog/multi-agent-philosophy.html">多 Agent 协作的本质：负优化还是工程必需？</a>
          <span class="file-meta">2026-05-18 14:33</span>
        </li>
        <li class="file-item">
          <a class="file-name" href="blog/skill-monetization.html">Skill 能卖吗？</a>
          <span class="file-meta">2026-05-18 14:33</span>
        </li>
        <li class="file-item">
          <a class="file-name" href="blog/skill-philosophy.html">Skill 的本质：不是复用，是迁移</a>
          <span class="file-meta">2026-05-18 14:33</span>
        </li>
      </ul>
    </section>

  </main>
</body>
</html>
